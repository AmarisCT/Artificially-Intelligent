name: Refresh research RSS feed
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_published.py"
      - "scripts/build_research_index.py"
      - "scripts/ledger_lib.py"
      - "scripts/capture_public_revisions.py"
      - "scripts/build_research_ledger.py"
      - "scripts/validate_research_ledger.py"
      - ".github/workflows/refresh-feed.yml"
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build-feed:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate RSS from public archive
        run: python3 scripts/build_feed.py
      # Research Ledger: record what is publicly published, notice real text changes, validate, rebuild.
      # It reads feed.xml only (never git history), so a scheduled rebuild with unchanged text records nothing.
      # It cannot block publishing: if any step fails, its changes are discarded and the rest of the job continues.
      - name: Research Ledger (capture versions, validate, rebuild)
        id: ledger
        continue-on-error: true
        run: |
          set -e
          python3 scripts/capture_public_revisions.py
          python3 scripts/validate_research_ledger.py
          python3 scripts/build_research_ledger.py
      - name: Discard Research Ledger changes that did not validate
        if: steps.ledger.outcome == 'failure'
        run: |
          git checkout -- research-ledger/data || true
          git clean -fdq research-ledger/data || true
          echo "::warning::The Research Ledger step failed. Its records were left as they were and publishing continued."
      - name: Generate published article pages and sitemaps
        run: python3 scripts/build_published.py
      - name: Rebuild shared research index (search and Inquiry Engine)
        run: |
          python3 scripts/build_research_index.py . --atlas scripts/atlas_dump.json
          cp scripts/pathway-rules.src.json inquiry-engine/data/pathway-rules.json
      - name: Commit updated feed and research pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml sitemap.xml sitemap.txt research/published/ inquiry-engine/data/ research-ledger/data/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh published research pages, sitemaps, and RSS feed"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy updated research to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
