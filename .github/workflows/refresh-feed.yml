name: Refresh research RSS feed
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_published.py"
      - "scripts/build_research_index.py"
      - "scripts/listening-room/lr_queue.py"
      - "scripts/listening-room/lr_common.py"
      - ".github/workflows/refresh-feed.yml"
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build-feed:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate RSS from public archive
        run: python3 scripts/build_feed.py
      - name: Generate published article pages and sitemaps
        run: python3 scripts/build_published.py
      - name: Check which published articles have audio, and flag recordings whose article changed
        # Reads only public files. Never creates, changes, approves or publishes a recording.
        # A problem here must never stop the article feed, pages and sitemaps from refreshing.
        continue-on-error: true
        run: python3 scripts/listening-room/lr_queue.py
      - name: Rebuild shared research index (search and Inquiry Engine)
        run: |
          python3 scripts/build_research_index.py . --atlas scripts/atlas_dump.json
          cp scripts/pathway-rules.src.json inquiry-engine/data/pathway-rules.json
      - name: Commit updated feed and research pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml sitemap.xml sitemap.txt research/published/ inquiry-engine/data/ listening-room/data/audio-queue.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh published research pages, sitemaps, and RSS feed"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy updated research to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
